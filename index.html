<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Barakah Studio - Auto-Save Salah Diary</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Plus+Jakarta+Sans:wght@300;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="diary-container">

        <div class="page theme-bg">
            <div class="cover-border-1"></div>
            <div class="cover-border-2"></div>
            <div class="cover-content">
                <div class="bismillah">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
                <div class="main-title">MY BEAUTIFUL<br>SALAH DIARY</div>
                <div class="quote">"Establish prayer, for it is the key to Jannah"</div>
                
                <!-- YAHAN MAINEY IMAGE LINK KI JAGAH COVER.JPG SET KAR DIYA HAI -->
                <div class="image-frame">
                    <img src="cover.jpg" alt="Salah Diary">
                </div>
                
                <div class="name-box">
                    <div class="belongs-to">This Diary Belongs To:</div>
                    <input type="text" id="user-name" class="interactive-input" placeholder="Type your name here...">
                </div>
            </div>
            <div class="branding">The Barakah Studio</div>
        </div>

        <div id="dynamic-pages"></div>

        <div class="page theme-bg end-bg">
            <div class="cover-border-1"></div>
            <div class="cover-border-2"></div>
            <div class="end-content">
                <div class="end-illustration">✨ 🤲 ✨</div>
                <h2 class="end-title">May your days be filled with Barakah.</h2>
                <div style="color: #FFB7B2; letter-spacing: 2px; font-size: 14px; margin-bottom: 8mm;">✦ ✦ ✦</div>
                <div class="end-barakah-studio">The Barakah Studio</div>
                <div class="end-sub">Premium Stationery & Journaling</div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
