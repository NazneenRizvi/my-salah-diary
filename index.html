<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Barakah Studio - Auto-Save Salah Diary</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Plus+Jakarta+Sans:wght@300;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <!-- Import Map for Firebase Web SDK (v10 modular) -->
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
        }
      }
    </script>
</head>
<body>

    <!-- Minimalist Sticky Login & Sync Bar -->
    <header class="app-header">
        <div class="header-logo">
            <span class="logo-emoji">✨</span>
            <span class="logo-text">The Barakah Studio</span>
        </div>
        <div class="header-controls">
            <!-- Sync Status Indicator -->
            <div id="sync-indicator" class="sync-indicator offline">
                <span class="sync-icon">☁️</span>
                <span class="sync-text">Local Only</span>
            </div>
            
            <!-- Auth Widget -->
            <div id="auth-widget" class="auth-widget">
                <button id="btn-login" class="btn-google">
                    <svg class="google-icon" viewBox="0 0 24 24" width="14" height="14">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22c-.08-.3-.12-.63-.12-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>Sign In</span>
                </button>
                <div id="user-profile" class="user-profile hidden">
                    <img id="user-avatar" class="user-avatar" src="" alt="Avatar">
                    <span id="user-display-name" class="user-display-name"></span>
                    <button id="btn-logout" class="btn-logout">Logout</button>
                </div>
            </div>
        </div>
    </header>

    <div id="diary-container">

        <div class="page theme-bg">
            <div class="cover-border-1"></div>
            <div class="cover-border-2"></div>
            <div class="cover-content">
                <div class="bismillah">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
                <div class="main-title">MY BEAUTIFUL<br>SALAH DIARY</div>
                <div class="quote">"Establish prayer, for it is the key to Jannah"</div>
                
                <!-- YAHAN MAINEY IMAGE LINK KI JAGAH COVER.JPG SET KAR DIYA HAI -->
                <div class="image-frame">
                    <img src="cover.jpg" alt="Salah Diary">
                </div>
                
                <div class="name-box">
                    <div class="belongs-to">This Diary Belongs To:</div>
                    <input type="text" id="user-name" class="interactive-input" placeholder="Type your name here...">
                </div>
            </div>
            <div class="branding">The Barakah Studio</div>
        </div>

        <div id="dynamic-pages"></div>

        <div class="page theme-bg end-bg">
            <div class="cover-border-1"></div>
            <div class="cover-border-2"></div>
            <div class="end-content">
                <div class="end-illustration">✨ 🤲 ✨</div>
                <h2 class="end-title">May your days be filled with Barakah.</h2>
                <div style="color: #FFB7B2; letter-spacing: 2px; font-size: 14px; margin-bottom: 8mm;">✦ ✦ ✦</div>
                <div class="end-barakah-studio">The Barakah Studio</div>
                <div class="end-sub">Premium Stationery & Journaling</div>
            </div>
        </div>

    </div>

    <!-- Modified script to be loaded as an ES Module -->
    <script type="module" src="script.js"></script>
</body>
</html>
